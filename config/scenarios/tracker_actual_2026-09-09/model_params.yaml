# =============================================================================
# Model Parameters: tracker_actual_2026-09-09
# =============================================================================
# Actual/current-law path against the 2026-09-09-13 tracker vintage. Successor
# to tracker_actual_2026-08-24 (2026-08-24-11). The vintage carries two rate
# changes to the daily series found in the tracker's September review; the
# 2026-09-08 import bans on Canadian alcohol, whey and motorcycles are NOT
# represented (they are quantity restrictions, not rates; ~0.25% of Canadian
# imports -- see docs/canada_s338_bans_2026-09/). Last policy boundary is
# still 2026-12-04.
#
# First scenario since 2026-06-25 to include foreign retaliation in GTAP. The
# shock file in retaliation/ is generated by build_retaliation_shocks.R from
# the WTO-IMF Tariff Tracker plus Canada's legal schedules (September 2026
# orders: 15/25/50% tiers, steel and aluminum at 50%, autos at 25%).
# Sibling tracker_actual_2026-09-09_no_retaliation is identical with the flag
# off and shares this scenario's calibration.
#
# Standard calibration: eta/alpha are refit against this basket over the shipped
# window (train 2025-06..2026-02, held-out test 2026-03), with the real Treasury
# level. Calibration GTAP solves run WITHOUT retaliation (the shock file is a
# static end-2026 state and would misstate 2025 window months).

rate_panel:
  vintage: '2026-09-09-13'
  tracker_scenario: 'actual'
  baseline_date: '2025-01-01'
  interval_end: 'inclusive'

# End-2026 policy state. Pinned to the vintage's last policy boundary.
gtap_reference_date: '2026-12-04'

gtap:
  include_retaliation: true

refund_2026: 166.0

noncompliance:
  eta_file: 'tracker_actual_2026-09-09/eta_by_partner_gtap.csv'

substitution:
  alpha_file: 'tracker_actual_2026-09-09/alpha/alpha_parameters.csv'
  commodity_passthrough_file: 'resources/calibration/gtap_commodity_sectors.csv'

calibration:
  include_retaliation: false
  window_start: '2025-06'
  window_end: '2026-02'
  months:
    - '2025-06'
    - '2025-07'
    - '2025-08'
    - '2025-09'
    - '2025-10'
    - '2025-11'
    - '2025-12'
    - '2026-01'
    - '2026-02'
    - '2026-03'

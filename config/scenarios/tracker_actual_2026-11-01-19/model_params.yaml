# =============================================================================
# Model Parameters: tracker_actual_2026-11-01-19
# =============================================================================
# Current law on the 2026-11-01-19 comparison vintage (actual + no_s338). That
# vintage's `actual` series is byte-identical to the 2026-11-01-13 release
# vintage's (same commit 4eb7293, same inputs), so this run reproduces
# tracker_actual_2026-11-01-13. It exists because the dashboard export requires
# every scenario to share one tracker vintage, and no_s338 is only in -19.
# Otherwise identical to tracker_actual_2026-11-01-13 (retaliation on; eta/alpha
# from the tracker_actual_2026-11-01-13 calibration).


rate_panel:
  vintage: '2026-11-01-19'
  tracker_scenario: 'actual'
  baseline_date: '2025-01-01'
  interval_end: 'inclusive'

# End-2026 policy state. Pinned to the vintage's last policy boundary.
gtap_reference_date: '2026-12-04'

gtap:
  include_retaliation: true

refund_2026: 166.0

noncompliance:
  eta_file: 'tracker_actual_2026-11-01-13/eta_by_partner_gtap.csv'

substitution:
  alpha_file: 'tracker_actual_2026-11-01-13/alpha/alpha_parameters.csv'
  commodity_passthrough_file: 'resources/calibration/gtap_commodity_sectors.csv'

calibration:
  include_retaliation: false
  window_start: '2025-06'
  window_end: '2026-02'
  months:
    - '2025-06'
    - '2025-07'
    - '2025-08'
    - '2025-09'
    - '2025-10'
    - '2025-11'
    - '2025-12'
    - '2026-01'
    - '2026-02'
    - '2026-03'

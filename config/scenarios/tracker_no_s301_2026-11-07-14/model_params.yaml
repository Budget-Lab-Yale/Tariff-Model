# =============================================================================
# Model Parameters: tracker_no_s301_2026-11-07-14
# =============================================================================
# "No Section 301" path: tracker series scenarios/no_s301 from the
# 2026-11-07-14 comparison vintage — the Section 301 actions taken since the
# January 2025 baseline removed (Brazil final action, forced-labor final action).
# The legacy China lists stay: they sit inside the January 2025 baseline that
# the model takes from the actual series, so removing them would net pre-2025
# revenue out of the increase. The difference against the default isolates the
# 2025-26 Section 301 actions.
# Otherwise identical to tracker_actual_2026-11-01-13 (foreign retaliation in
# GTAP on; eta/alpha REUSE the tracker_actual_2026-11-01-13 calibration).

rate_panel:
  vintage: '2026-11-07-14'
  tracker_scenario: 'no_s301'
  baseline_date: '2025-01-01'
  interval_end: 'inclusive'

# End-2026 policy state. Pinned to the vintage's last policy boundary.
gtap_reference_date: '2026-12-04'

gtap:
  include_retaliation: true

refund_2026: 166.0

noncompliance:
  eta_file: 'tracker_actual_2026-11-01-13/eta_by_partner_gtap.csv'

substitution:
  alpha_file: 'tracker_actual_2026-11-01-13/alpha/alpha_parameters.csv'
  commodity_passthrough_file: 'resources/calibration/gtap_commodity_sectors.csv'

calibration:
  include_retaliation: false
  window_start: '2025-06'
  window_end: '2026-02'
  months:
    - '2025-06'
    - '2025-07'
    - '2025-08'
    - '2025-09'
    - '2025-10'
    - '2025-11'
    - '2025-12'
    - '2026-01'
    - '2026-02'
    - '2026-03'

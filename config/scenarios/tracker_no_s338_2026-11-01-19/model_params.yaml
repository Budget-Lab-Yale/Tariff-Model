# "No Section 338" path for the 2026-11 release: tracker series scenarios/no_s338
# from the 2026-11-01-19 comparison vintage (same code and inputs as the
# 2026-11-01-13 release vintage, built with actual + no_s338). Otherwise
# identical to tracker_actual_2026-11-01-13, including foreign retaliation in
# GTAP, so the difference against the default isolates the Section 338 actions.
# eta/alpha REUSE the actual scenario's calibration (tracker_actual_2026-11-01-13).


rate_panel:
  vintage: '2026-11-01-19'
  tracker_scenario: 'no_s338'
  baseline_date: '2025-01-01'
  interval_end: 'inclusive'

# End-2026 policy state. Pinned to the vintage's last policy boundary.
